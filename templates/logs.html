{% extends "base.html" %}
{% block title %}Logs{% endblock %}
{% block content %}
<h1>System Logs</h1>
<button class="btn" onclick="loadLogs()">🔄 Refresh</button>
<div class="card">
  <div id="logs" class="logs-full">Loading…</div>
</div>
{% endblock %}
{% block scripts %}
<script>
async function loadLogs(){
  const r = await fetch('/api/logs');
  const logs = await r.json();
  document.getElementById('logs').innerHTML = logs.length
    ? logs.map(l => `<div class="log-line ${l.level.toLowerCase()}">[${l.created_at}] [${l.level}] ${l.message}</div>`).join('')
    : 'No logs.';
}
loadLogs();
setInterval(loadLogs, 8000);
</script>
{% endblock %}
